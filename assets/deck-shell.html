<!doctype html>
<html lang="ko" data-format="board">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{SUMMARY}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SUMMARY}}">
<meta property="og:url" content="https://kywoo26.github.io/research-library/research/{{SLUG}}/">
<meta name="twitter:card" content="summary">
<style>
/* ═══ board 셸 ═══════════════════════════════════════════════
   장은 주장(h2) 하나와 그 주장을 담은 판(board) 하나다. 작성자는 상자가 어느 줄(lane)
   어느 칸(col)에 있는지만 쓰고, 좌표와 화살표와 차트는 아래 스크립트가 계산한다.
   html 의 data-format="board" 가 이 셸이라는 표시다. 게이트와 도구가 이것으로 옛 셸과 가른다. */

/* ── tokens. tone 의 뜻은 모든 문서에서 같다 ── */
:root {
  color-scheme: light;
  --paper:#f6f6f3; --card:#ffffff; --ink:#1f2328; --ink-2:#424a53; --muted:#6e7781; --rule:#d8dee4; --wire:#6e7781;
  --s1:#0969da; --s2:#cf4a22; --dim:#afb8c1;
  --n-bg:#ffffff; --n-bd:#c9d1d9; --n-ink:#1f2328;   /* 기본: 대상 하나 */
  --k-bg:#eef4ff; --k-bd:#0969da; --k-ink:#0550ae;   /* t-key: 판에서 장이 주장하는 상자 하나 (판마다 하나까지) */
  --g-bg:#effbf2; --g-bd:#1a7f37; --g-ink:#116329;   /* t-good: 좋아진다, 권한다 */
  --w-bg:#fff8c5; --w-bd:#9a6700; --w-ink:#7d4e00;   /* t-warn: 조건, 주의 */
  --b-bg:#ffebe9; --b-bd:#cf222e; --b-ink:#a40e26;   /* t-bad: 실패, 나빠진다 */
  --p-bg:#fff0f6; --p-bd:#bf3989; --p-ink:#99286e;   /* t-person: 사람이 하는 일 */
  --q-bg:#f6f8fa; --q-bd:#afb8c1; --q-ink:#424a53;   /* t-quiet: 배경, 재지 않은 것 */
  --r-bg:#f8f5ff; --r-bd:#8250df; --r-ink:#6639ba;   /* react: 원문 밖의 반응 */
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper:#0d1117; --card:#161b22; --ink:#e6edf3; --ink-2:#b1bac4; --muted:#8b949e; --rule:#30363d; --wire:#8b949e;
    --s1:#4493f8; --s2:#f0883e; --dim:#545d68;
    --n-bg:#161b22; --n-bd:#3d444d; --n-ink:#e6edf3;
    --k-bg:#0c2240; --k-bd:#4493f8; --k-ink:#79b8ff;
    --g-bg:#0f2a19; --g-bd:#3fb950; --g-ink:#7ee787;
    --w-bg:#2a2110; --w-bd:#d29922; --w-ink:#e3b341;
    --b-bg:#3a1418; --b-bd:#f85149; --b-ink:#ff8e86;
    --p-bg:#33152a; --p-bd:#db61a2; --p-ink:#f2a3cf;
    --q-bg:#1b2029; --q-bd:#545d68; --q-ink:#b1bac4;
    --r-bg:#1f1733; --r-bd:#a371f7; --r-ink:#d2a8ff;
  }
}

/* ── page ── */
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
/* 한국어는 어절 안에서 끊으면 조사가 앞말과 떨어진다 */
h1,h2,p,li,.card,.lane-label,.axis-h,figcaption,td,th { word-break:keep-all; overflow-wrap:break-word; }
.topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:8px 28px; font-size:13px; color:var(--muted);
  background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--rule); }
.topbar a { color:var(--s1); text-decoration:none; font-weight:600; }
.topbar .now { color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
main { max-width:1200px; margin:0 auto; padding:0 28px 120px; }
section.slide { padding:52px 0 36px; border-top:1px solid var(--rule); scroll-margin-top:40px; }
section.slide[data-role="cover"] { border-top:0; padding-top:36px; }
.chno { font:600 12px var(--mono); color:var(--muted); margin:0 0 8px; letter-spacing:.02em; }
h1 { font-size:clamp(28px,3.6vw,42px); line-height:1.18; letter-spacing:-.02em; margin:0 0 14px; max-width:22em; text-wrap:balance; }
h2 { font-size:clamp(22px,2.5vw,29px); line-height:1.28; letter-spacing:-.015em; margin:0 0 10px; max-width:30em; text-wrap:balance; }
h3 { font-size:15px; margin:0 0 6px; }
.answer { font-size:clamp(16px,1.5vw,18px); line-height:1.65; max-width:46em; margin:0 0 10px; }
p.src { font-size:13px; color:var(--muted); max-width:62em; margin:0 0 26px; }
.lead { font-size:15.5px; color:var(--ink-2); max-width:60em; margin:0 0 20px; }
.so { font-size:15px; max-width:60em; margin:16px 0 0; padding-left:12px; border-left:3px solid var(--g-bd); }
.block-title { font-size:14px; font-weight:700; margin:26px 0 8px; color:var(--ink); }
ul.notes { list-style:none; margin:12px 0 0; padding:0; display:grid; gap:4px; font-size:13px; color:var(--muted); max-width:70em; }
ul.notes li::before { content:"· "; }
ul.points { list-style:none; margin:0; padding:0; display:grid; gap:10px; max-width:64em; }
ul.points li { background:var(--card); border:1px solid var(--rule); border-radius:9px; padding:10px 14px; font-size:14.5px; }
ul.points li > b:first-child { display:block; margin-bottom:2px; }
ul.sources { list-style:none; margin:0; padding:0; display:grid; gap:8px; font-size:14px; }
ul.sources a { color:var(--s1); overflow-wrap:anywhere; }
ul.sources .t { color:var(--ink-2); }
details.orig { margin:18px 0 0; font-size:13.5px; color:var(--ink-2); }
details.orig summary { cursor:pointer; color:var(--muted); font-size:13px; font-weight:600; }
details.orig p { margin:8px 0; max-width:70em; }
span.q { color:var(--ink-2); }
a.xref, .lead a, .so a, ul.notes a, ul.points a { color:var(--s1); text-underline-offset:2px; }
code { font:12.5px var(--mono); background:var(--q-bg); padding:1px 4px; border-radius:4px; }
pre { font:12px/1.62 var(--mono); background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:14px 16px; overflow-x:auto; margin:0 0 14px; color:var(--ink-2); }
pre b { color:var(--ink); } pre code { background:none; padding:0; }
pre .c { color:var(--muted); } pre .k { color:var(--s1); } pre .r { color:var(--b-ink); }
.good { color:var(--g-ink); font-weight:700; } .bad { color:var(--b-ink); font-weight:700; }
.plate { background:#fff; border:1px solid var(--rule); border-radius:10px; padding:10px; }
.plate img { display:block; width:100%; height:auto; }
.tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--rule); border-radius:10px; margin:0 0 14px; }
table { border-collapse:collapse; font-size:13px; width:100%; }
td,th { padding:7px 12px; text-align:left; vertical-align:top; border-bottom:1px solid var(--rule); line-height:1.5; }
th { color:var(--muted); font-weight:600; font-size:12px; }
tr:last-child td { border-bottom:0; }
:focus-visible { outline:2px solid var(--s1); outline-offset:2px; border-radius:3px; }

/* ── board ── */
.board { position:relative; display:grid; column-gap:40px; row-gap:20px; align-items:stretch;
  background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:22px 24px; margin:0; }
.board.dense { column-gap:18px; }
.board > .edge { position:absolute; z-index:3; font-size:11.5px; line-height:1.3; color:var(--ink-2); background:var(--card);
  padding:1px 5px; border-radius:4px; white-space:nowrap; }
.board > .edge:empty { display:none; }
svg.wires { position:absolute; left:0; top:0; pointer-events:none; z-index:0; overflow:visible; }
svg.wires path { stroke:var(--wire); stroke-width:1.6; fill:none; }
svg.wires path.head { fill:var(--wire); stroke:none; }
svg.wires path.tether { stroke:var(--r-bd); stroke-dasharray:3 3; stroke-width:1.4; }
.lane-label { font-size:13px; font-weight:700; color:var(--ink-2); align-self:center; }
.lane-rule { align-self:start; height:0; border-top:1px dashed var(--rule); margin-top:-10px; }
.axis-h { font:700 12.5px var(--mono); color:var(--ink-2); text-align:center; padding:0 0 6px; border-bottom:2px solid var(--rule); align-self:end; }
.board[data-axis-arrow] .axis-h { border-bottom-color:transparent; }
.axis-arrow { height:0; border-top:2px solid var(--muted); align-self:end; position:relative; margin-bottom:-1px; }
.axis-arrow::after { content:""; position:absolute; right:-2px; top:-6px; border:5px solid transparent; border-left:8px solid var(--muted); }
.axis-cap { font-size:11.5px; line-height:1.35; color:var(--muted); align-self:end; padding-bottom:4px; }

/* ── card ── */
.card { position:relative; z-index:1; display:block; background:var(--n-bg); border:1px solid var(--n-bd); border-radius:9px;
  padding:11px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); text-decoration:none; }
.card > b { display:block; font-size:14.5px; line-height:1.4; color:var(--n-ink); margin:0 0 3px; }
.card p { margin:0 0 2px; }
.card .ev { color:var(--muted); font-size:12.5px; line-height:1.45; margin-top:6px; }
.card .big { display:block; font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.1; color:var(--n-ink); margin-top:2px; }
.card .big small { font-size:14px; font-weight:600; color:var(--ink-2); }
.card ul { margin:2px 0 0; padding-left:16px; } .card li { margin:1px 0; }
.card a { color:var(--s1); }
.chip { display:inline-block; font:600 11.5px/1.5 var(--mono); padding:0 6px; border-radius:5px; border:1px solid var(--n-bd); color:var(--ink-2); margin:0 4px 4px 0; background:var(--card); }
.card .colchip, .card .to { display:none; }
.card.slim { padding:7px 12px; }
.card.slim > b { font-size:15px; margin:0; }
.card.slim .ev { margin-top:0; }
.t-key { --n-bg:var(--k-bg); --n-bd:var(--k-bd); --n-ink:var(--k-ink); }
.t-good { --n-bg:var(--g-bg); --n-bd:var(--g-bd); --n-ink:var(--g-ink); }
.t-warn { --n-bg:var(--w-bg); --n-bd:var(--w-bd); --n-ink:var(--w-ink); }
.t-bad { --n-bg:var(--b-bg); --n-bd:var(--b-bd); --n-ink:var(--b-ink); }
.t-person { --n-bg:var(--p-bg); --n-bd:var(--p-bd); --n-ink:var(--p-ink); }
.t-quiet { --n-bg:var(--q-bg); --n-bd:var(--q-bd); --n-ink:var(--q-ink); }
a.card[href]:hover { outline:2px solid var(--n-bd); outline-offset:1px; }
a.inert { cursor:default; }
/* 원문 밖의 반응. 바꾸는 주장(data-on) 바로 아래에 붙고 혼자 서지 않는다 */
.card.react { --n-bg:var(--r-bg); --n-bd:var(--r-bd); --n-ink:var(--r-ink); border-style:dashed; border-width:1.5px; font-size:13px; }
.card.react .who { display:block; font:600 11.5px/1.5 var(--mono); color:var(--r-ink); margin:0 0 4px; }
.card.react .who::before { content:"외부 반응 · "; }
.card.react .check { margin-top:6px; color:var(--ink-2); }
.card.react .check::before { content:"원문 대조: "; font-weight:700; color:var(--ink); }
.verdict { display:inline-block; font:700 11px/1.5 var(--mono); padding:0 6px; border-radius:5px; margin-right:4px; }
.verdict.holds { background:var(--g-bg); color:var(--g-ink); border:1px solid var(--g-bd); }
.verdict.contra { background:var(--b-bg); color:var(--b-ink); border:1px solid var(--b-bd); }
.verdict.open { background:var(--q-bg); color:var(--q-ink); border:1px solid var(--q-bd); }

/* ── split, panel, ladder ── */
.split { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); gap:18px; align-items:start; }
.split.even { grid-template-columns:1fr 1fr; }
.panel { background:var(--card); border:1px solid var(--rule); border-radius:12px; padding:18px 20px; }
.panel > .block-title:first-child { margin-top:0; }
.panel > .ev { font-size:12.5px; color:var(--muted); margin:10px 0 0; }
.ladder { display:grid; gap:16px; }
.ladder > .card:not(:first-child)::before { content:""; position:absolute; left:22px; top:-16px; height:15px; border-left:1.6px solid var(--wire); }
.meter { display:block; height:6px; border-radius:3px; background:var(--rule); margin:6px 0 2px; overflow:hidden; }
.meter i { display:block; height:100%; background:var(--n-bd); }

/* ── plot: 표가 데이터이고 그림은 셸이 그린다 ── */
figure.plot { margin:0; }
.fig-title { font-size:14.5px; font-weight:700; margin:0 0 2px; }
.fig-sub { font-size:12.5px; color:var(--muted); margin:0 0 10px; }
.plot-legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--ink-2); margin:0 0 4px; }
.plot-legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.plot-canvas svg { display:block; }
.plot-canvas .grid { stroke:var(--rule); stroke-width:1; }
.plot-canvas .tick { fill:var(--muted); font:11px var(--mono); }
.plot-canvas .ln { fill:none; stroke-width:2.2; stroke-linejoin:round; }
.plot-canvas .dot { stroke:var(--card); stroke-width:2; }
.plot-canvas .lbl { font:12px var(--sans); fill:var(--ink-2); }
.plot-canvas .lbl.strong { font-weight:700; fill:var(--ink); }
.plot-canvas .mk { font:700 11px var(--mono); fill:var(--ink); }
.plot-canvas .ref { stroke:var(--muted); stroke-dasharray:4 3; stroke-width:1.4; }
ol.plot-marks { margin:4px 0 0; padding-left:0; list-style:none; font-size:12px; color:var(--ink-2); display:flex; flex-wrap:wrap; gap:4px 14px; }
ol.plot-marks b { font-family:var(--mono); }
.bars { display:grid; gap:9px; }
.bar-row { display:grid; grid-template-columns:minmax(80px,140px) 1fr; gap:10px; align-items:center; }
.bar-name { font-size:12.5px; color:var(--ink-2); text-align:right; }
.bar-row.is-em .bar-name, .bar-row.is-em .bar-val { color:var(--ink); font-weight:700; }
.bar-set { display:grid; gap:2px; }
.bar-line { display:grid; grid-template-columns:1fr minmax(3.6em, max-content); gap:8px; align-items:center; }
.bar-track { height:11px; background:repeating-linear-gradient(to right, transparent 0 calc(25% - 1px), var(--rule) calc(25% - 1px) 25%); border-radius:2px; }
.bar-fill { display:block; height:100%; border-radius:0 3px 3px 0; }
.bar-val { font:12px var(--mono); color:var(--ink-2); text-align:right; }
figure.plot figcaption { font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
details.vals { margin-top:6px; font-size:12.5px; }
details.vals summary { cursor:pointer; color:var(--muted); }
details.vals table { width:auto; font-size:12.5px; }
details.vals td, details.vals th { padding:3px 10px 3px 0; }

/* ── cover: 논증 흐름과 나머지 장의 짧은 목록 ── */
.board .card[data-center] { align-self:center; }
.toc { margin:18px 0 0; }
.toc-h { font-size:13px; font-weight:700; color:var(--ink-2); margin:0 0 6px; }
.toc ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); grid-auto-flow:column; column-gap:32px; }
.toc li { display:grid; grid-template-columns:64px auto 1fr; gap:10px; align-items:baseline; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--rule); }
.toc .g { font-size:12px; color:var(--muted); }
.toc a { color:var(--ink); text-decoration:none; font-weight:600; white-space:nowrap; }
.toc a[href]:hover { color:var(--s1); text-decoration:underline; }
.toc .f { color:var(--muted); font-size:12.5px; }

/* ── 좁은 화면: 판은 읽는 순서대로 한 줄이 되고 화살표는 글이 된다 ── */
@media (max-width: 760px) {
  .topbar { padding:8px 16px; }
  main { padding:0 14px 80px; }
  section.slide { padding:36px 0 26px; }
  .board { display:flex; flex-direction:column; gap:8px; padding:14px; }
  .board .lane-rule, .board .axis-h, .board .axis-arrow, .board .axis-cap, .board > .edge, .board > svg.wires { display:none; }
  .board .lane-label { margin:10px 0 0; font-size:12.5px; color:var(--muted); }
  .card .colchip { display:inline-block; }
  .card .to { display:block; font-size:12.5px; color:var(--ink-2); margin-top:6px; }
  .split, .split.even { grid-template-columns:1fr; }
  .toc ul { grid-template-columns:1fr; grid-template-rows:none !important; grid-auto-flow:row; }
  .toc li { grid-template-columns:1fr; gap:0; }
  .toc .g:empty { display:none; }
  .toc a { white-space:normal; }
  .bar-row { grid-template-columns:1fr; gap:2px; } .bar-name { text-align:left; }
}
@media print { .topbar { display:none; } section.slide { break-inside:avoid-page; } }
</style>

<script>
/* board 셸 스크립트
   board : data-cols/data-lanes 와 상자의 data-col/data-lane → CSS grid. .edge → 꺾은선 화살표
   plot  : table.plot-data → 그 자리 너비로 그린 SVG(선) 또는 막대. 표는 데이터로 남는다
   좁은 화면(≤760px): 판은 읽는 순서대로 한 줄, 화살표는 상자 안의 글줄
   스스로 검사: 상자를 지나는 화살표, 겹친 글, 넘친 글, 없는 칸 → window.__layout.warnings
   render.mjs 는 window.__layout.done 이 true 가 된 뒤 warnings 를 읽는다 */
(function () {
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var list = function (s) { return (s || '').split('|').map(function (x) { return x.trim(); }).filter(Boolean); };
  var narrow = function () { return window.matchMedia('(max-width: 760px)').matches; };
  var NS = 'http://www.w3.org/2000/svg';
  var warnings = [];
  window.__layout = { warnings: warnings, done: false };
  var warn = function (where, msg) { var w = where + ': ' + msg; if (warnings.indexOf(w) < 0) warnings.push(w); };
  var titleOf = function (el) { return ((el.querySelector(':scope > b') || el).textContent || '').replace(/\s+/g, ' ').trim(); };
  // 그림의 값: [약|~] [+|-] [$] 숫자(쉼표 가능) [k|M|B] [단위]. 단위 목록은 check-doc.mjs 의 plot-data 와 같다
  var NUM = /^([+-]?)\$?(\d+(?:\.\d+)?)([kMB]?)(%p|%|pt|ms|s|초|분|시간|일|건|개|번|회|명|배|x|×|원|달러)?$/;
  var num = function (t) {
    var m = NUM.exec(String(t).replace(/약|~|,|\s/g, ''));
    if (!m) return NaN;
    return (m[1] === '-' ? -1 : 1) * parseFloat(m[2]) * ({ k: 1e3, M: 1e6, B: 1e9 }[m[3]] || 1);
  };

  /* ── 장 번호, 목차 링크, 위 막대 ── */
  var secs = $$('section.slide');
  secs.forEach(function (s, k) {
    if (!s.id) s.id = 'p' + (k + 1);
    if (s.getAttribute('data-role') === 'cover') return;
    var c = document.createElement('p'); c.className = 'chno'; c.setAttribute('aria-hidden', 'true');
    c.textContent = String(k + 1).padStart(2, '0') + ' · ' + (s.getAttribute('data-label') || '');
    s.insertBefore(c, s.firstChild);

      var rs = rows.filter(function (r) { return r.s === s; });
      el('polyline', { class: 'ln', stroke: colorFor(emph, s), points: rs.map(function (r) { return X(r.x) + ',' + Y(r.y); }).join(' ') });
      rs.forEach(function (r, i) { pts.push([X(r.x), Y(r.y)]); if (i) segs.push([[X(rs[i - 1].x), Y(rs[i - 1].y)], [X(r.x), Y(r.y)]]); });
      rs.forEach(function (r) { el('circle', { class: 'dot', cx: X(r.x), cy: Y(r.y), r: emph.indexOf(s) >= 0 ? 5 : 4, fill: colorFor(emph, s) }); });
    });
    var refIds = (table.dataset.ref || '').split(/\s+/).filter(Boolean);
    var ra = rows.filter(function (r) { return r.id === refIds[0]; })[0], rb = rows.filter(function (r) { return r.id === refIds[1]; })[0];
    if (ra && rb) { el('line', { class: 'ref', x1: X(ra.x) + 6, y1: Y(ra.y), x2: X(rb.x) - 6, y2: Y(rb.y) }); segs.push([[X(ra.x), Y(ra.y)], [X(rb.x), Y(rb.y)]]); }
    var score = function (b, withMarks) {
      var n = 0;
      if (b.x < 0 || b.x + b.width > W || b.y < 0 || b.y + b.height > H - m.b + 4) n += 5;
      placed.forEach(function (q) { if (b.x < q.x + q.width && b.x + b.width > q.x && b.y < q.y + q.height && b.y + b.height > q.y) n += 3; });
      pts.forEach(function (p) { if (p[0] > b.x - 5 && p[0] < b.x + b.width + 5 && p[1] > b.y - 5 && p[1] < b.y + b.height + 5) n += 2; });
      if (!withMarks) segs.forEach(function (sg) { for (var k = 0; k <= 10; k++) { var sx = sg[0][0] + (sg[1][0] - sg[0][0]) * k / 10, sy = sg[0][1] + (sg[1][1] - sg[0][1]) * k / 10; if (sx > b.x && sx < b.x + b.width && sy > b.y && sy < b.y + b.height) { n += 1; break; } } });
      return n;
    };
    var fit = function (t, x, y, offs, loose) {
      var best = null;
      for (var i = 0; i < offs.length; i++) {
        var o = offs[i]; t.setAttribute('x', x + o[0]); t.setAttribute('y', y + o[1]); t.setAttribute('text-anchor', o[2]);
        var b = t.getBBox(), box = { x: b.x - 2, y: b.y - 1, width: b.width + 4, height: b.height + 2 }, sc = score(box, loose);
        if (!best || sc < best.sc) best = { sc: sc, o: o, box: box };
        if (sc === 0) break;
      }
      t.setAttribute('x', x + best.o[0]); t.setAttribute('y', y + best.o[1]); t.setAttribute('text-anchor', best.o[2]);
      return best;
    };
    var OFF = [[9, 4, 'start'], [0, -11, 'middle'], [-9, 4, 'end'], [0, 19, 'middle'], [7, -9, 'start'], [-7, -9, 'end'], [7, 17, 'start'], [-7, 17, 'end'],
      [14, -14, 'start'], [-14, -14, 'end'], [14, 24, 'start'], [-14, 24, 'end'], [0, -22, 'middle'], [0, 30, 'middle']];
    var MK = [[6, -6, 'start'], [-6, -6, 'end'], [6, 14, 'start'], [-6, 14, 'end'], [9, 4, 'start'], [-9, 4, 'end'], [0, -10, 'middle'], [0, 18, 'middle']];
    var marks = 0;
    // 글을 둘 자리가 없으면 점 옆에 번호만 두고 글은 그림 아래 목록으로 보낸다. 선택 글은 범례가 대신한다.
    var place = function (x, y, text, cls, fill, offs, optional) {
      var t = el('text', { class: cls, fill: fill || '' }, text), best = fit(t, x, y, offs, false);
      if (best.sc === 0) { placed.push(best.box); return; }
      t.remove(); if (optional) return;
      var n = String(++marks), k = el('text', { class: 'mk' }, n), bm = fit(k, x, y, MK, true);
      placed.push(bm.box);
      if (bm.sc >= 3) warn(name, 'marker for "' + text + '" overlaps');
      var li = document.createElement('li'); li.innerHTML = '<b>' + n + '</b> '; li.appendChild(document.createTextNode(text)); mkl.appendChild(li);
    };
    rows.filter(function (r) { return r.label; }).forEach(function (r) { place(X(r.x), Y(r.y), r.label, emph.indexOf(r.s) === 0 ? 'lbl strong' : 'lbl', '', OFF, false); });
    if (ra && rb && table.dataset.refLabel) place((X(ra.x) + X(rb.x)) / 2, (Y(ra.y) + Y(rb.y)) / 2, table.dataset.refLabel, 'lbl', 'var(--muted)', [[0, 16, 'middle'], [0, -8, 'middle'], [0, 30, 'middle']], true);
    series.filter(function (s) { return !rows.some(function (r) { return r.s === s && r.label; }); }).forEach(function (s) {
      var rs = rows.filter(function (r) { return r.s === s; }), r = rs[rs.length - 1]; place(X(r.x), Y(r.y), s, 'lbl', 'var(--muted)', OFF, true);
    });
    svg.setAttribute('aria-label', ((fig.querySelector('.fig-title') || {}).textContent || '') + '. ' + series.map(function (s) {
      return s + ': ' + rows.filter(function (r) { return r.s === s; }).map(function (r) { return r.tr.cells[xi].textContent.trim() + ', ' + r.tr.cells[yi].textContent.trim(); }).join('; ');
    }).join('. '));
  }
  function drawPlot(fig) {
    if (!fig._t) return;
    if (fig._t.dataset.kind === 'bars') drawBars(fig); else drawLine(fig);
  }

  /* ── ladder: 막대 길이는 상자에 적힌 숫자에서 잰다. 같은 수를 두 번 쓰지 않는다 ── */
  $$('.ladder[data-meter]').forEach(function (lad) {
    var bigs = $$(':scope > .card .big', lad), vals = bigs.map(function (b) { return Math.abs(num(b.textContent.replace(/[+p]/g, ''))); });
    var mx = Math.max.apply(null, vals);
    bigs.forEach(function (b, i) { var m = document.createElement('span'); m.className = 'meter'; m.setAttribute('aria-hidden', 'true'); m.innerHTML = '<i style="width:' + (mx ? vals[i] / mx * 100 : 0) + '%"></i>'; b.parentNode.insertBefore(m, b.nextSibling); });
  });

  // 표지 목록은 두 칸에 위에서 아래로 채운다
  $$('.toc ul').forEach(function (u) { u.style.gridTemplateRows = 'repeat(' + Math.ceil(u.children.length / 2) + ', auto)'; });
  var boards = $$('.board'); boards.forEach(buildBoard);
  var buildWarn = warnings.slice();
  var plots = $$('figure.plot'); plots.forEach(buildPlot);
  var layout = function () {
    warnings.length = 0; buildWarn.forEach(function (w) { warnings.push(w); });
    plots.forEach(drawPlot); boards.forEach(wire); boards.forEach(overflowCheck);
  };
  var tm; window.addEventListener('resize', function () { clearTimeout(tm); tm = setTimeout(layout, 120); });
  layout();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { layout(); window.__layout.done = true; });
})();
</script>
