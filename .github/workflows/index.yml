# 목록(index.html, README.md 의 docs 블록)은 생성물이라 문서 PR 에 넣지 않는다. 같이 넣으면 main 이
# 움직일 때마다 열린 PR 이 이 두 파일에서 충돌했다(2026-10-25 #17, #21). merge 뒤 main 에서 다시 만든다.
name: index
on:
  push:
    branches: [main]
    paths: ['research/**', 'scripts/build-index.mjs']
permissions:
  contents: write
  pages: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build-index
        run: node scripts/build-index.mjs
      - name: commit if changed
        run: |
          git diff --quiet -- index.html README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "목록을 다시 만들다"
          git push
          # GITHUB_TOKEN 의 push 는 다른 실행을 깨우지 않으므로 Pages 빌드를 직접 요청한다.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
