name = "plan-review"
description = "Reviews the plan of a research document before it is written: the request, the list of asks, the message, the chapter plan, the diagrams and the analysis notes, in a context that did not write them, and reports what the plan misses or gets wrong. Use when research-doc asks for the plan review."
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
developer_instructions = "Read `.agents/skills/research-verify/references/plan-review.md` and follow it."

[features]
memories = false
apps = false
plugins = false
request_permissions_tool = false
